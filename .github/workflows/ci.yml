name: CI

on:
  push:
  pull_request:

jobs:
  patch-check:
    name: PLCG patch applies to upstream pluto 0.12.0
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check patch
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/bondhugula/pluto.git /tmp/pluto
          cd /tmp/pluto
          git apply --check "$GITHUB_WORKSPACE/patches/pluto-0.12.0-plcg.patch"

  build-and-smoke:
    name: Build PLCG pluto and run the smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libgmp-dev libmpfr-dev flex bison texinfo python3 python3-pip
      - name: Install python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Build pluto + wrappers
        run: ./scripts/setup_pluto.sh
      - name: Smoke test
        run: ./scripts/smoke_test.sh
