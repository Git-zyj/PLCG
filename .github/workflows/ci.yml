name: CI

on:
  push:
  pull_request:

jobs:
  patch-check:
    name: PLCG patch applies to upstream pluto 0.12.0
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check patch
        run: |
          git clone --depth 1 --branch 0.12.0 https://github.com/bondhugula/pluto.git /tmp/pluto
          cd /tmp/pluto
          git apply --check "$GITHUB_WORKSPACE/patches/pluto-0.12.0-plcg.patch"

  build-and-smoke:
    name: Build PLCG pluto and run the smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Only pluto itself: the pins of pluto's nested submodules
          # (e.g. cloog-isl/isl) are no longer advertised by their remotes, so
          # a recursive fetch fails. scripts/setup_pluto.sh fetches what it can
          # and falls back to third_party/pluto-0.12.0-deps.tar.gz.
          submodules: true
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libgmp-dev libmpfr-dev flex bison texinfo \
            llvm llvm-14-tools llvm-14-dev clang clang-14 libclang-14-dev \
            python3 python3-pip
      - name: Install python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Build pluto + wrappers
        run: ./scripts/setup_pluto.sh
      - name: Smoke test
        run: ./scripts/smoke_test.sh

  corpus-regression:
    name: Corpus regression (engines agree, pipeline runs end to end)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libgmp-dev libmpfr-dev flex bison texinfo \
            llvm llvm-14-tools llvm-14-dev clang clang-14 libclang-14-dev \
            python3 python3-pip
      - name: Install python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Build pluto
        run: ./scripts/setup_pluto.sh
      - name: Generate the sample corpus (option 1 = 32 kernels)
        run: python3 random_generation.py --option 1 -j 4
      - name: Stage 2 through the chunked driver
        run: |
          python3 optimization_and_analysis.py -i examples -o /tmp/fast \
            -p Compilers/pluto/polycc_parallel -j 4 -t 60 | tail -5
      - name: Stage 2 through the shell wrapper
        run: |
          python3 optimization_and_analysis.py -i examples -o /tmp/ref \
            -p Compilers/pluto/polycc_parallel -j 4 -t 60 --driver wrapper | tail -5
      - name: Both engines must produce identical artefacts
        run: |
          diff -r /tmp/fast/pluto_code /tmp/ref/pluto_code
          diff -r /tmp/fast/stdout /tmp/ref/stdout
      - name: Stages 3 and 4 on the fast-path outputs
        run: |
          cp -r /tmp/fast/pluto_code /tmp/fast/stdout examples/
          python3 loop_transformation_classifier.py -i examples \
            -o classification_output.csv -j 4 | tail -3
          python3 rag_preprocess.py -i examples -o examples \
            -c classification_output.csv -j 4 | tail -6
          test -s "$(ls examples/plcg_*.json | head -1)"
